apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-demo-deployment
  annotations:
    argocd-image-updater.argoproj.io/image-list: data-demo=hamzaaitmouhaoualla/data-demo-api
    argocd-image-updater.argoproj.io/data-demo.update-strategy: newest-build
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-demo
  template:
    metadata:
      labels:
        app: data-demo
    spec:
      containers:
      - name: data-demo
        image: hamzaaitmouhaoualla/data-demo-api:latest
        ports:
        - containerPort: 8080
